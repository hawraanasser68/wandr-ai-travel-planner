server {
    listen 80;
    server_name _;

    # Serve the React build
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend service
    # "backend" matches the service name in docker-compose.yml
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agent/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Required for SSE streaming — disable nginx buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # All other requests go to index.html so React Router handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
